<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Níveis 1, 2 e 3 e o desafio bônus</title>
  <desc id="desc">No nível 1 a carta fica fixa. No nível 2 girar custa lances. No nível 3 espelhar também custa. O bônus usa duas cartas.</desc>
  <rect width="1080" height="420" rx="18" fill="#f6f0e6"/>
  <text x="28" y="40" fill="#24160f" font-family="Georgia, 'Times New Roman', serif" font-size="26">A carta também pode ser um lance</text>
  <text x="28" y="66" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Girar ou espelhar a figura muda o alvo. Cada transformação entra na conta, no lugar de mover uma peça.</text>

  <defs>
    <g id="nd"><rect width="36" height="36" fill="#7a4630"/></g>
    <g id="nl"><rect width="36" height="36" fill="#f3e0c4"/></g>
  </defs>

  <!-- card mini used three times: Q R N / . K . / . . B -->
  <!-- LEVEL 1 -->
  <g transform="translate(28,96)">
    <rect width="240" height="280" rx="12" fill="#fffaf3" stroke="#e4d3bc"/>
    <text x="20" y="32" fill="#24160f" font-family="Georgia, serif" font-size="20">Nível 1</text>
    <text x="20" y="54" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">A carta fica como foi virada.</text>
    <g transform="translate(62,78)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      <rect x="-8" y="-16" width="124" height="148" rx="6" fill="#fbf6ee" stroke="#24160f"/>
      <polygon points="54,-6 46,6 62,6" fill="#c4923a"/>
      <g transform="translate(0,16)">
        <use href="#nd"/><text x="18" y="23" fill="#f6f0e6">D</text>
        <use href="#nl" x="36"/><text x="54" y="23" fill="#24160f">T</text>
        <use href="#nd" x="72"/><text x="90" y="23" fill="#f6f0e6">C</text>
        <use href="#nl" y="36"/>
        <use href="#nd" x="36" y="36"/><text x="54" y="59" fill="#f6f0e6">R</text>
        <use href="#nl" x="72" y="36"/>
        <use href="#nd" y="72"/>
        <use href="#nl" x="36" y="72"/>
        <use href="#nd" x="72" y="72"/><text x="90" y="95" fill="#f6f0e6">B</text>
      </g>
    </g>
    <text x="20" y="258" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Só as peças se movem.</text>
  </g>

  <!-- LEVEL 2 -->
  <g transform="translate(288,96)">
    <rect width="250" height="280" rx="12" fill="#fffaf3" stroke="#e4d3bc"/>
    <text x="20" y="32" fill="#24160f" font-family="Georgia, serif" font-size="20">Nível 2</text>
    <text x="20" y="54" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Girar a carta custa lances.</text>
    <g transform="translate(36,100)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <use href="#nd"/><text x="18" y="22" fill="#f6f0e6">D</text>
      <use href="#nl" x="36"/><text x="54" y="22" fill="#24160f">T</text>
      <use href="#nd" x="72"/><text x="90" y="22" fill="#f6f0e6">C</text>
      <use href="#nl" y="36"/><use href="#nd" x="36" y="36"/><text x="54" y="58" fill="#f6f0e6">R</text><use href="#nl" x="72" y="36"/>
      <use href="#nd" y="72"/><use href="#nl" x="36" y="72"/><use href="#nd" x="72" y="72"/><text x="90" y="94" fill="#f6f0e6">B</text>
    </g>
    <text x="168" y="150" fill="#c4923a" font-family="Georgia, serif" font-size="28">↻</text>
    <text x="20" y="230" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">90° horário ou anti-horário = 1 lance.</text>
    <text x="20" y="250" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">180° = 2 lances.</text>
  </g>

  <!-- LEVEL 3 -->
  <g transform="translate(558,96)">
    <rect width="250" height="280" rx="12" fill="#fffaf3" stroke="#e4d3bc"/>
    <text x="20" y="32" fill="#24160f" font-family="Georgia, serif" font-size="20">Nível 3</text>
    <text x="20" y="54" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Espelhar também custa 1 lance.</text>
    <g transform="translate(70,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      <use href="#nd"/><text x="18" y="23" fill="#f6f0e6">C</text>
      <use href="#nl" x="36"/><text x="54" y="23" fill="#24160f">T</text>
      <use href="#nd" x="72"/><text x="90" y="23" fill="#f6f0e6">D</text>
      <text x="54" y="150" fill="#3d2b1f" font-size="12" font-weight="500">esquerda ↔ direita</text>
    </g>
    <text x="20" y="250" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Espelho horizontal ou vertical.</text>
    <text x="20" y="268" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">As rotações do nível 2 continuam valendo.</text>
  </g>

  <!-- BONUS -->
  <g transform="translate(828,96)">
    <rect width="224" height="280" rx="12" fill="#fffaf3" stroke="#e4d3bc"/>
    <text x="20" y="32" fill="#24160f" font-family="Georgia, serif" font-size="20">Bônus</text>
    <text x="20" y="54" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Duas cartas, uma conta só.</text>
    <g transform="translate(28,84)">
      <rect width="70" height="86" rx="4" fill="#fbf6ee" stroke="#24160f"/>
      <rect x="24" y="16" width="70" height="86" rx="4" fill="#fff" stroke="#24160f"/>
    </g>
    <text x="20" y="214" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Você escolhe qual carta</text>
    <text x="20" y="232" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">fechar primeiro. As peças</text>
    <text x="20" y="250" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">ficam onde pararam.</text>
  </g>
</svg>
