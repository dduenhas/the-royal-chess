<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo oficial resolvido em quatro lances</title>
  <desc id="desc">Cavalo para A3, torre para C1, rei para B1 e dama para A2.</desc>
  <rect width="1120" height="470" rx="18" fill="#f6f0e6"/>
  <text x="28" y="38" fill="#24160f" font-family="Georgia, 'Times New Roman', serif" font-size="24">O exemplo do manual cabe em quatro lances</text>
  <text x="28" y="62" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">A peça com aro dourado é a que acabou de se mover. Ninguém captura ninguém: cada lance só abre caminho.</text>

  <defs>
    <g id="d">
      <rect width="40" height="40" fill="#7a4630"/>
    </g>
    <g id="l">
      <rect width="40" height="40" fill="#f3e0c4"/>
    </g>
  </defs>

  <!-- helper boards drawn explicitly -->
  <!-- START -->
  <g transform="translate(24,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">Início</text>
    <g transform="translate(0,10)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><use href="#l" x="40"/><text x="60" y="26" fill="#24160f">D</text><use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><text x="20" y="66" fill="#24160f">R</text><use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/><text x="100" y="66" fill="#24160f">C</text>
      <use href="#d" y="80"/><text x="20" y="106" fill="#f6f0e6">T</text><use href="#l" x="40" y="80"/><use href="#d" x="80" y="80"/>
    </g>
  </g>

  <text x="168" y="160" fill="#c4923a" font-size="22" font-family="Georgia, serif">→</text>

  <!-- 1 knight A3 -->
  <g transform="translate(196,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">1. Cavalo → A3</text>
    <g transform="translate(0,10)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><circle cx="20" cy="20" r="15" fill="none" stroke="#c4923a" stroke-width="3"/><text x="20" y="25" fill="#f6f0e6">C</text>
      <use href="#l" x="40"/><text x="60" y="26" fill="#24160f">D</text>
      <use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><text x="20" y="66" fill="#24160f">R</text><use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/>
      <use href="#d" y="80"/><text x="20" y="106" fill="#f6f0e6">T</text><use href="#l" x="40" y="80"/><use href="#d" x="80" y="80"/>
    </g>
  </g>

  <text x="340" y="160" fill="#c4923a" font-size="22" font-family="Georgia, serif">→</text>

  <!-- 2 rook C1 -->
  <g transform="translate(368,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">2. Torre → C1</text>
    <g transform="translate(0,10)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><text x="20" y="26" fill="#f6f0e6">C</text>
      <use href="#l" x="40"/><text x="60" y="26" fill="#24160f">D</text>
      <use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><text x="20" y="66" fill="#24160f">R</text><use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/>
      <use href="#d" y="80"/><use href="#l" x="40" y="80"/>
      <use href="#d" x="80" y="80"/><circle cx="100" cy="100" r="15" fill="none" stroke="#c4923a" stroke-width="3"/><text x="100" y="105" fill="#f6f0e6">T</text>
    </g>
  </g>

  <text x="512" y="160" fill="#c4923a" font-size="22" font-family="Georgia, serif">→</text>

  <!-- 3 king B1 -->
  <g transform="translate(540,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">3. Rei → B1</text>
    <g transform="translate(0,10)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><text x="20" y="26" fill="#f6f0e6">C</text>
      <use href="#l" x="40"/><text x="60" y="26" fill="#24160f">D</text>
      <use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/>
      <use href="#d" y="80"/>
      <use href="#l" x="40" y="80"/><circle cx="60" cy="100" r="15" fill="none" stroke="#c4923a" stroke-width="3"/><text x="60" y="105" fill="#24160f">R</text>
      <use href="#d" x="80" y="80"/><text x="100" y="106" fill="#f6f0e6">T</text>
    </g>
  </g>

  <text x="684" y="160" fill="#c4923a" font-size="22" font-family="Georgia, serif">→</text>

  <!-- 4 queen A2 = target -->
  <g transform="translate(712,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">4. Dama → A2</text>
    <g transform="translate(0,10)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><text x="20" y="26" fill="#f6f0e6">C</text>
      <use href="#l" x="40"/>
      <use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><circle cx="20" cy="60" r="15" fill="none" stroke="#c4923a" stroke-width="3"/><text x="20" y="65" fill="#24160f">D</text>
      <use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/>
      <use href="#d" y="80"/>
      <use href="#l" x="40" y="80"/><text x="60" y="106" fill="#24160f">R</text>
      <use href="#d" x="80" y="80"/><text x="100" y="106" fill="#f6f0e6">T</text>
    </g>
  </g>

  <!-- target card -->
  <g transform="translate(900,88)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="0" text-anchor="middle" fill="#24160f" font-size="13" font-weight="700">Carta de objetivo</text>
    <rect x="16" y="12" width="132" height="156" rx="8" fill="#fbf6ee" stroke="#24160f" stroke-width="2"/>
    <polygon points="82,20 74,32 90,32" fill="#c4923a"/>
    <g transform="translate(32,40)" font-size="13" font-weight="700" text-anchor="middle">
      <use href="#d"/><text x="20" y="26" fill="#f6f0e6">C</text><use href="#l" x="40"/><use href="#d" x="80"/><text x="100" y="26" fill="#f6f0e6">B</text>
      <use href="#l" y="40"/><text x="20" y="66" fill="#24160f">D</text><use href="#d" x="40" y="40"/><use href="#l" x="80" y="40"/>
      <use href="#d" y="80"/><use href="#l" x="40" y="80"/><text x="60" y="106" fill="#24160f">R</text><use href="#d" x="80" y="80"/><text x="100" y="106" fill="#f6f0e6">T</text>
    </g>
  </g>

  <text x="28" y="300" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Por que esta ordem, e não outra: o cavalo salta para A3 e libera C2. A torre atravessa a fileira 1 vazia até C1.</text>
  <text x="28" y="322" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">O rei desce na diagonal para B1 e libera A2. Só então a dama entra em A2.</text>
  <text x="28" y="352" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Quatro lances é o mínimo desse par de posições.</text>
  <text x="28" y="374" fill="#3d2b1f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Um caminho com cinco lances também chega na carta, mas no jogo ele perde para quem viu o caminho de quatro.</text>
  <text x="28" y="408" fill="#6b5344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Letras: R rei, D dama, T torre, B bispo, C cavalo. O triângulo dourado na carta marca a orientação: no nível 1 ela não gira.</text>
</svg>
